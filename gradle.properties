# The IntelliJ Platform provides the Kotlin stdlib at runtime; never bundle our own.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# Allow KSP to register generated sources via kotlin.sourceSets (required until KSP natively
# targets AGP's built-in Kotlin source-set DSL).
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
android.builtInKotlin=false
android.newDsl=false
